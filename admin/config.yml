backend:
  name: git-gateway
  branch: main

# Uploaded images go here (inside the site repo)
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "reels"
    label: "Reels — Watch section"
    files:
      - name: "all"
        label: "All reels"
        file: "content/reels.json"
        fields:
          - label: "Reels"
            name: "reels"
            widget: "list"
            summary: "{{fields.issue}} ({{fields.year}})"
            fields:
              - { label: "Issue", name: "issue", widget: "string", hint: "The topic of the reel" }
              - { label: "Format", name: "format", widget: "string", default: "Reel · Vertical" }
              - { label: "Views", name: "views", widget: "string", default: "—" }
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Thumbnail image", name: "thumb", widget: "image", required: false, hint: "Vertical cover shown on the card" }
              - label: "Orientation"
                name: "orientation"
                widget: "select"
                options: ["vertical", "horizontal"]
                default: "vertical"
                hint: "Vertical = reels row, horizontal = videos row"
              - { label: "Video file", name: "video", widget: "string", required: false, hint: "Local path, e.g. videos/my-video.mp4 — plays inside the site" }
              - { label: "YouTube link or ID", name: "youtube", widget: "string", required: false, hint: "If set, the video plays embedded from YouTube instead of the local file" }

  - name: "gallery"
    label: "Gallery — Visualise your cause"
    files:
      - name: "all"
        label: "All gallery items"
        file: "content/gallery.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{fields.caption}} — {{fields.category}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string" }
              - { label: "Details (shown in the popup)", name: "details", widget: "text", required: false, hint: "A few lines about the project: client, idea, what it says" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Campaigns", value: "campaigns" }
                  - { label: "Posters", value: "posters" }
                  - { label: "Identity", value: "identity" }
                  - { label: "Social", value: "social" }
                  - { label: "Illustration", value: "illustration" }
                  - { label: "Art Direction", value: "art-direction" }
                  - { label: "Web", value: "web" }

  - name: "cases"
    label: "Case studies — From → To"
    files:
      - name: "all"
        label: "All case studies"
        file: "content/cases.json"
        fields:
          - label: "Cases"
            name: "cases"
            widget: "list"
            summary: "{{fields.from}} → {{fields.to}}"
            fields:
              - { label: "From", name: "from", widget: "string" }
              - { label: "To", name: "to", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "What changed because of the work?", name: "impact", widget: "text" }
              - label: "Status"
                name: "status"
                widget: "select"
                default: "published"
                options:
                  - { label: "Published", value: "published" }
                  - { label: "Draft — refining soon", value: "draft" }
                  - { label: "Coming soon", value: "coming-soon" }

  - name: "impact"
    label: "Impact section"
    files:
      - name: "all"
        label: "Impact cards"
        file: "content/impact.json"
        fields:
          - label: "Cards"
            name: "cards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Note under the cards", name: "note", widget: "text" }
